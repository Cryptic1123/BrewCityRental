<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Account Management - BCR Prototype</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<nav class="navbar">
    <a href="dashboard.html">Dashboard</a>
    <a href="customer-management.html" class="active">Customers</a>
    <a href="../../Index.html">Logout</a>
</nav>
<div class="container">
    <h1>Customer Account Management</h1>
    <div class="search-section">
        <input
            type="text"
            id="customerSearch"
            placeholder="Search by customer ID, name, or email...">
    </div>
    <table class="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Verified</th>
                <th>Status</th>
                <th>Balance</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="customerTable">
        </tbody>
    </table>
</div>
<script src="../../assets/js/main.js"></script>
</body>
</html>
