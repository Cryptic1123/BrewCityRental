<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Management - BCR Prototype</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body>
    <nav class="navbar">
        <a href="dashboard.html">Dashboard</a>
        <a href="movie-management.html" class="active">Movies</a>
        <a href="../../Index.html">Logout</a>
    </nav>

    <div class="container">
        <h1>Movie Management</h1>

        <div class="action-buttons">
            <button class="btn btn-primary" onclick="location.href='add-movie.html'">
                Add New Movie
            </button>
        </div>

        <div class="search-section">
            <input type="text" id="movieSearch" placeholder="Search title or description...">
        </div>

        <table class="data-table">
            <thead>
                <tr>
                    <th>Movie ID</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Rating</th>
                    <th>Release Year</th>
                    <th>Status</th>
                    <th>Rental Category</th>
                    <th>Rental Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="movieManagementTable">
            </tbody>
        </table>
    </div>

    <script src="../../assets/js/main.js"></script>
</body>

</html>
