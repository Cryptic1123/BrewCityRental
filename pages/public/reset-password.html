<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="page-wrapper">
    <div class="container">
      <div class="login-card">
        <h1>Reset Password</h1>
        <p class="helper-text">Enter your reset token and choose a new password to recover your account.</p>

        <form id="resetForm">
          <div class="form-group">
            <label for="token">Reset Token</label>
            <input id="token" name="token" type="text" required>
          </div>

          <div class="form-group password-field">
            <label for="newPassword">New Password</label>
            <div class="password-input-row">
              <input id="newPassword" name="newPassword" type="password" required>
              <label class="show-password-label">
                <input type="checkbox" id="showResetPassword">
                <span>Show</span>
              </label>
            </div>
          </div>

          <div class="button-row">
            <button type="submit" class="btn btn-primary">Reset Password</button>
            <a class="btn btn-secondary" href="customer-login.html">Back to Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
<script src="../../assets/js/main.js"></script>
</body>
</html>
